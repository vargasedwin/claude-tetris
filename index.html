<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('tetris-theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro" title="Modo claro / oscuro">
        <span aria-hidden="true">🌙</span><span aria-hidden="true">☀️</span>
      </button>
    </div>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-box" class="records-box hidden">
          <form id="name-entry" class="name-entry hidden" autocomplete="off">
            <p id="name-entry-msg"></p>
            <div class="name-entry-row">
              <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
              <button id="save-record-btn" type="submit">Guardar</button>
            </div>
          </form>
          <p class="label">TOP 5</p>
          <ol id="records-list" class="records-list"></ol>
          <p id="records-extra" class="records-extra"></p>
          <div class="records-reset">
            <button id="reset-records-btn" type="button" class="link-btn">Resetear récords</button>
            <span id="reset-confirm" class="hidden">
              ¿Borrar todo?
              <button id="reset-yes-btn" type="button" class="link-btn danger">Sí</button>
              <button id="reset-no-btn" type="button" class="link-btn">No</button>
            </span>
          </div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
